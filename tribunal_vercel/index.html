<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Interview Prep — mgmolledo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');
:root{--black:#0a0a0a;--amber:#d4820a;--amber-dim:#6a4200;--surface:#111;--surface2:#181818;--border:#2a2a2a;--text:#e0d8c8;--dim:#6a6050;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--black);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column}
header{border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:baseline;gap:14px}
.h1{font-family:'Playfair Display',serif;font-size:1rem;font-weight:400;color:var(--amber)}
.sub{font-size:.68rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-family:monospace}
.tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface)}
.tab{flex:1;padding:13px;background:none;border:none;border-right:1px solid var(--border);color:var(--dim);font-family:monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.tab:last-child{border-right:none}
.tab.active{color:var(--amber);background:rgba(212,130,10,.08)}
.main{max-width:820px;margin:0 auto;padding:28px;display:flex;flex-direction:column;gap:20px;width:100%}
.panel{display:none}.panel.active{display:flex;flex-direction:column;gap:20px}
.mic-zone{display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 20px;border:1px solid var(--border);background:var(--surface);border-radius:2px}
.mic-btn{width:80px;height:80px;border-radius:50%;border:2px solid var(--border);background:var(--surface2);color:var(--dim);font-size:1.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.mic-btn.listening{border-color:var(--red);color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.3)}50%{box-shadow:0 0 0 14px rgba(192,57,43,0)}}
.mic-lbl{font-family:monospace;font-size:.65rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.mic-lbl.on{color:var(--red)}
.box{padding:16px 20px;background:var(--surface);border:1px solid var(--border);border-radius:2px}
.lbl{font-family:monospace;font-size:.62rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.transcript{font-size:.9rem;line-height:1.6;color:var(--text);font-style:italic;min-height:22px}
.q-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:.9rem;line-height:1.6;padding:12px 14px;resize:vertical;min-height:60px;border-radius:2px;font-style:italic}
.q-input:focus{outline:none;border-color:var(--amber-dim)}
.send-row{display:flex;justify-content:flex-end}
.resp-box{border:1px solid var(--amber-dim);background:rgba(212,130,10,.04);border-radius:2px}
.resp-hdr{padding:10px 18px;border-bottom:1px solid var(--amber-dim);background:rgba(212,130,10,.06)}
.resp-lbl{font-family:monospace;font-size:.62rem;color:var(--amber);letter-spacing:.1em;text-transform:uppercase}
.resp-cnt{padding:18px 20px;font-size:.9rem;line-height:1.8;min-height:60px;white-space:pre-wrap}
.resp-cnt.empty{color:var(--dim)}
.resp-cnt.loading{color:var(--dim);font-style:italic}
.topics{display:flex;flex-wrap:wrap;gap:6px}
.tbtn{padding:7px 13px;background:var(--surface);border:1px solid var(--border);color:var(--dim);font-family:'IBM Plex Sans',sans-serif;font-size:.75rem;cursor:pointer;border-radius:2px;transition:all .15s}
.tbtn.active{border-color:var(--amber);color:var(--amber);background:rgba(212,130,10,.1)}
.gbtn{padding:11px 22px;background:var(--amber);color:var(--black);border:none;font-family:monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;cursor:pointer;border-radius:2px}
.gbtn:disabled{background:var(--dim);cursor:not-allowed}
.q-box{padding:18px 20px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:2px}
.q-lbl{font-family:monospace;font-size:.62rem;color:var(--amber-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.q-txt{font-family:'Playfair Display',serif;font-size:1rem;line-height:1.5}
.hist-item{padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:2px;font-size:.82rem;line-height:1.65}
.hist-q{font-family:monospace;font-size:.62rem;color:var(--amber-dim);margin-bottom:5px}
.sp{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--amber);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:#e07060}
code{font-family:monospace;background:var(--surface2);padding:1px 5px;border-radius:2px;font-size:.82rem;color:var(--amber)}
</style>
</head>
<body>
<header>
  <span class="h1">Data Interview Prep</span>
  <span class="sub">Python &middot; SQL &middot; ML &middot; Stats &middot; Data Engineering &middot; mgmolledo</span>
</header>
<div class="tabs">
  <button class="tab active" onclick="setTab('listen')">&#127908; Pregunta libre</button>
  <button class="tab" onclick="setTab('practice')">&#9889; Simulacro</button>
</div>
<div class="main">

  <div id="panel-listen" class="panel active">
    <div class="mic-zone">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()">&#127908;</button>
      <span class="mic-lbl" id="mic-lbl">Pulsa para dictar la pregunta</span>
    </div>
    <div class="box">
      <div class="lbl">Pregunta — edita si es necesario</div>
      <textarea class="q-input" id="transcript" placeholder="Escribe o dicta cualquier pregunta técnica de entrevista..."></textarea>
      <div class="send-row" style="margin-top:10px">
        <button class="gbtn" id="send-btn" onclick="sendTranscript()">Enviar pregunta</button>
      </div>
    </div>
    <div class="resp-box">
      <div class="resp-hdr"><span class="resp-lbl">Respuesta de coaching</span></div>
      <div class="resp-cnt empty" id="live-resp">La respuesta aparecerá aquí.</div>
    </div>
  </div>

  <div id="panel-practice" class="panel">
    <div>
      <div class="lbl" style="margin-bottom:10px">Bloque temático</div>
      <div class="topics" id="topics"></div>
    </div>
    <button class="gbtn" id="gbtn" onclick="genQ()">&#9889; Lanzar pregunta</button>
    <div class="q-box" id="q-box" style="display:none">
      <div class="q-lbl">Pregunta de entrevista</div>
      <div class="q-txt" id="q-txt"></div>
    </div>
    <div class="resp-box" id="p-resp-box" style="display:none">
      <div class="resp-hdr"><span class="resp-lbl">Respuesta</span></div>
      <div class="resp-cnt" id="p-resp"></div>
    </div>
    <div id="hist"></div>
  </div>

</div>
<script>
var TOPICS=[
  {id:'all',       label:'Todos'},
  {id:'python',    label:'Python'},
  {id:'sql',       label:'SQL'},
  {id:'ml',        label:'Machine Learning'},
  {id:'stats',     label:'Estadística'},
  {id:'feature',   label:'Feature Engineering'},
  {id:'de',        label:'Data Engineering'},
  {id:'system',    label:'System Design'},
  {id:'trampas',   label:'Trampas clásicas'},
  {id:'proyectos', label:'Mis proyectos'},
];

var QS={
  python:[
    "¿Cuál es la diferencia entre iloc y loc en pandas?",
    "¿Cuándo usarías un generator en lugar de una list comprehension?",
    "¿Qué es el GIL de Python y cómo afecta al paralelismo?",
    "¿Cómo vectorizarías una operación que ahora haces con apply()?",
    "¿Qué ventajas tiene polars sobre pandas para datasets grandes?",
    "Explica qué hace este código: df.groupby('cat')['val'].transform('mean')",
    "¿Cómo funciona un decorador en Python? Pon un ejemplo útil en datos.",
    "¿Cuándo usarías dataclasses en vez de un dict para estructurar datos?",
    "¿Cómo harías un merge de dos DataFrames con claves duplicadas?",
    "¿Qué es memory_usage() y por qué importa en producción?",
  ],
  sql:[
    "¿Cuándo usarías una CTE en lugar de una subquery?",
    "Explica ROW_NUMBER vs RANK vs DENSE_RANK con un ejemplo.",
    "¿Cómo funciona LAG() y para qué lo usarías en análisis de datos?",
    "¿Qué es un índice covering y cuándo lo crearías?",
    "¿Cómo identificarías duplicados en una tabla SQL sin usar DISTINCT?",
    "¿Cuál es la diferencia entre WHERE y HAVING?",
    "¿Cómo harías un anti-join en SQL?",
    "¿Qué diferencia hay entre particionar y clusterizar en BigQuery?",
    "¿Cómo optimizarías una query que escanea 500GB en BigQuery?",
    "¿Cómo se comportan los NULLs en un GROUP BY?",
  ],
  ml:[
    "¿Cuándo usarías Random Forest en lugar de Gradient Boosting?",
    "¿Qué es el bias-variance tradeoff y cómo lo gestionas en práctica?",
    "¿Cuándo usarías AUC-ROC y cuándo la curva PR?",
    "¿Cómo evitarías data leakage en un pipeline de ML?",
    "¿Qué es early stopping y cómo funciona en XGBoost?",
    "¿Cómo validarías un modelo de series temporales sin hacer data leakage?",
    "¿Cuándo usarías SMOTE y cuándo ajustarías class_weight?",
    "¿Qué diferencia hay entre bagging y boosting?",
    "¿Cómo interpretarías un modelo con R² de 0.99 en train y 0.70 en test?",
    "¿Qué es un Pipeline de sklearn y por qué usarlo en producción?",
  ],
  stats:[
    "¿Qué significa exactamente un p-valor de 0.03?",
    "¿Cuál es la diferencia entre intervalo de confianza e intervalo de predicción?",
    "¿Cómo calcularías el tamaño muestral de un A/B test?",
    "¿Qué es el problema de las comparaciones múltiples y cómo lo resolverías?",
    "¿Cuándo usarías correlación de Spearman en lugar de Pearson?",
    "Explica la paradoja de Simpson con un ejemplo real.",
    "¿Qué es el efecto mínimo detectable en un experimento?",
    "¿Cuál es la diferencia entre error tipo I y tipo II?",
    "¿Qué supuestos viola la regresión lineal con más frecuencia en datos reales?",
    "¿Cómo detectarías multicolinealidad y qué harías con ella?",
  ],
  feature:[
    "¿Cuándo usarías target encoding en lugar de one-hot encoding?",
    "¿Qué es feature leakage y cómo lo detectarías?",
    "¿Cómo imputarías datos faltantes en una serie temporal?",
    "¿Cuándo escalarías features y cuándo no haría falta?",
    "¿Cómo crearías features de lag para un modelo predictivo?",
    "¿Qué es la importancia de SHAP y en qué se diferencia de la importancia de RandomForest?",
    "¿Cómo tratarías una variable categórica con 500 categorías?",
    "¿Qué es la mutual information y cuándo la usarías para selección de features?",
    "¿Cómo detectarías y tratarías outliers antes de entrenar un modelo?",
    "¿Qué ventajas tiene KNN imputation sobre imputación por media?",
  ],
  de:[
    "¿Cuál es la diferencia entre ETL y ELT? ¿Cuándo elegirías cada uno?",
    "¿Qué es dbt y qué problema resuelve?",
    "¿Cómo diseñarías un pipeline de datos idempotente?",
    "¿Qué es un DAG en Airflow y cómo gestionarías los reintentos?",
    "¿Cuándo usarías streaming en lugar de batch processing?",
    "¿Qué es un data lakehouse y en qué se diferencia de un data warehouse?",
    "¿Cómo particionarías una tabla en BigQuery para optimizar costes?",
    "¿Qué son los tests de dbt y qué tipos existen?",
    "¿Cómo versionarías datos en un pipeline de producción?",
    "¿Qué es el concepto de observabilidad en pipelines de datos?",
  ],
  system:[
    "Diseña un sistema de recomendación para un ecommerce con 10M de usuarios.",
    "¿Cómo diseñarías un pipeline de detección de anomalías en tiempo real?",
    "¿Qué es un feature store y cuándo tiene sentido construirlo?",
    "¿Cómo garantizarías la calidad de datos en un pipeline productivo?",
    "¿Cómo escalarías un modelo de ML que actualmente tarda 2 horas en inferencia batch?",
    "Diseña el esquema de tablas para un sistema de tracking de eventos de usuario.",
    "¿Cómo orquestarías un pipeline que depende de 5 fuentes externas con SLAs distintos?",
    "¿Qué trade-offs considerarías entre consistencia y disponibilidad en un data pipeline?",
  ],
  trampas:[
    "¿El p-valor es la probabilidad de que la hipótesis nula sea cierta?",
    "¿LEFT JOIN y LEFT OUTER JOIN son lo mismo?",
    "¿Un R² alto garantiza que el modelo es bueno?",
    "¿La correlación de Pearson detecta relaciones no lineales?",
    "¿La feature importance de Random Forest es siempre fiable?",
    "¿Accuracy es siempre la mejor métrica para clasificación?",
    "¿Más datos siempre mejoran un modelo?",
    "¿Normalizar features siempre mejora el rendimiento de un modelo?",
    "¿iloc y loc son intercambiables si el índice es numérico?",
    "¿Un modelo con overfitting siempre tiene R² perfecto en train?",
  ],
  proyectos:[
    "Explica el ETL del SME Benchmark: fuente, transformaciones y output.",
    "¿Por qué elegiste KNN para imputar en el TFM y qué alternativas consideraste?",
    "¿Cómo justificas el R² de 0.986 en el modelo ML del TFM sin que sea overfitting?",
    "¿Qué es el Power BI MCP Server y qué problema resuelve?",
    "¿Por qué el coeficiente del gasto sanitario es negativo en TWFE y positivo en OLS?",
    "¿Cómo verificaste el supuesto de tendencias paralelas en el DiD del TFM?",
    "¿Qué aprendiste del análisis de eficiencia frontier que no esperabas?",
    "¿Cómo automatizarías la actualización del SME Benchmark con datos nuevos del BdE?",
    "¿Qué harías diferente en el TFM si pudieras repetirlo?",
    "¿Cómo conectarías el output SQLite del SME Benchmark a Power BI en producción?",
  ],
};

async function askClaude(question) {
  var base = window.location.origin;
  var resp = await fetch(base + '/api/answer', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({question: question})
  });
  var data = await resp.json();
  if (!resp.ok) throw new Error(data.error || resp.statusText);
  return data.answer || 'Sin respuesta.';
}

var tab='listen', topic='all', listening=false, rec=null, history=[];

function setTab(t){
  tab=t;
  document.querySelectorAll('.tab').forEach(function(b,i){
    b.classList.toggle('active',(i===0&&t==='listen')||(i===1&&t==='practice'));
  });
  document.getElementById('panel-listen').classList.toggle('active',t==='listen');
  document.getElementById('panel-practice').classList.toggle('active',t==='practice');
}

function toggleMic(){ listening?stopMic():startMic(); }

function startMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){alert('Necesitas Chrome para usar el micrófono.');return;}
  rec=new SR();rec.lang='es-ES';rec.continuous=true;rec.interimResults=true;
  var fin='';
  rec.onresult=function(e){
    fin=Array.from(e.results).map(function(r){return r[0].transcript;}).join(' ').trim();
    document.getElementById('transcript').value=fin;
  };
  rec.onend=function(){
    if(listening){rec.start();return;}
    fin='';
  };
  rec.onerror=function(e){
    if(e.error==='no-speech'&&listening){rec.start();return;}
    stopMic();
  };
  rec.start();listening=true;
  document.getElementById('mic-btn').classList.add('listening');
  document.getElementById('mic-btn').textContent='Stop';
  document.getElementById('mic-lbl').textContent='Escuchando...';
  document.getElementById('mic-lbl').classList.add('on');
}

function stopMic(){
  listening=false;if(rec){try{rec.stop();}catch(e){}}
  document.getElementById('mic-btn').classList.remove('listening');
  document.getElementById('mic-btn').innerHTML='&#127908;';
  document.getElementById('mic-lbl').textContent='Pulsa para dictar la pregunta';
  document.getElementById('mic-lbl').classList.remove('on');
}

function sendTranscript(){
  var t=document.getElementById('transcript').value.trim();
  if(t.length>3)answerLive(t);
}

async function answerLive(q){
  var el=document.getElementById('live-resp');
  el.innerHTML='<span class="sp"></span>Consultando...';el.className='resp-cnt loading';
  try{var a=await askClaude(q);el.textContent=a;el.className='resp-cnt';}
  catch(e){el.innerHTML='<span class="err">Error: '+e.message+'</span>';el.className='resp-cnt';}
}

function buildTopics(){
  var c=document.getElementById('topics');
  TOPICS.forEach(function(t){
    var b=document.createElement('button');
    b.className='tbtn'+(t.id==='all'?' active':'');
    b.textContent=t.label;
    b.onclick=function(){
      topic=t.id;
      document.querySelectorAll('.tbtn').forEach(function(x){x.classList.remove('active');});
      b.classList.add('active');
    };
    c.appendChild(b);
  });
}

async function genQ(){
  var pool=topic==='all'?Object.values(QS).flat():(QS[topic]||[]);
  if(!pool.length)return;
  var q=pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('q-box').style.display='block';
  document.getElementById('q-txt').textContent=q;
  document.getElementById('p-resp-box').style.display='block';
  var el=document.getElementById('p-resp');
  el.innerHTML='<span class="sp"></span>Consultando...';el.className='resp-cnt loading';
  document.getElementById('gbtn').disabled=true;
  try{
    var a=await askClaude(q);
    el.textContent=a;el.className='resp-cnt';
    history.unshift({q:q,a:a});renderHist();
  }catch(e){
    el.innerHTML='<span class="err">Error: '+e.message+'</span>';el.className='resp-cnt';
  }
  document.getElementById('gbtn').disabled=false;
}

function renderHist(){
  document.getElementById('hist').innerHTML=history.slice(1,5).map(function(i){
    return '<div class="hist-item"><div class="hist-q">'+i.q+'</div><div>'+i.a+'</div></div>';
  }).join('');
}

buildTopics();
</script>
</body>
</html>
